id = "goatnath/spotify-lyrics"
name = "Spotify Lyrics"
version = "1.3.0"
plugin_api = 3
author = "goatnath"
license = "MIT"
dependencies = ["playerctl", "python3", "syncedlyrics"]
tags = ["music", "bar", "panel", "desktop", "service"]
icon = "music"
description = "Time-synced lyrics panel linked to the media widget."

# Headless background service: reads daemon state and publishes to noctalia.state
[[service]]
id = "service"
entry = "service.luau"

# Minimal bar trigger: tiny glyph icon next to the media widget.
# Auto-hides when nothing is playing. Click to open the lyrics panel.
[[widget]]
id = "lyrics"
entry = "bar.luau"

# Lyrics panel: 3-line synced view anchored near the media area.
[[panel]]
id = "lyrics-panel"
entry = "panel.luau"
width = 460
height = 280

[[desktop_widget]]
id = "lyrics-desktop"
entry = "widget.luau"

# Desktop widget entry settings: edited in the desktop widget editor, next to the
# Background switch. widget.luau republishes them so the bar and panel follow.

# Bar button, desktop widget and panel all disappear while nothing is playing.
# Set false to keep the "No music playing" placeholder instead.
[[desktop_widget.setting]]
key = "hide_when_idle"
type = "bool"
default = true
label_key = "settings.hide_when_idle.label"
description_key = "settings.hide_when_idle.description"

# Bar icon, track glyph and artist name.
[[desktop_widget.setting]]
key = "accent_color"
type = "color"
default = "primary"
label_key = "settings.accent_color.label"
description_key = "settings.accent_color.description"

# Current lyric line and track title.
[[desktop_widget.setting]]
key = "active_color"
type = "color"
default = "on_surface"
label_key = "settings.active_color.label"
description_key = "settings.active_color.description"

# Previous/next lines, separators and empty states.
[[desktop_widget.setting]]
key = "inactive_color"
type = "color"
default = "on_surface_variant"
label_key = "settings.inactive_color.label"
description_key = "settings.inactive_color.description"
